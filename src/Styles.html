<style>
/* Visual system from design/My_PE_Profile_mockup.html (profile, light) and
   design/G8_Build_Your_Card.html (card, dark). FIS maroon + gold, Archivo + Inter
   with a system fallback unless Config web_fonts = TRUE. */
:root{
  --maroon:#6f1d2c;--maroon-t:#f3e6e8;--gold:#e7b64b;
  --fit:#e8730c;--fit-t:#fdecdc;--fund:#0e8f86;--fund-t:#d9f2f0;--skill:#2f6df0;--skill-t:#e8f0fe;
  --ap:#1f9d57;--ap-t:#e6f6ec;--rep:#8a3bb0;--rep-t:#f3e8fa;
  --ink:#161213;--ink-soft:#463c3e;--muted:#7a6f71;--paper:#f7f4f2;--card:#fff;--line:#e7e0df;
  --disp:"Archivo","Barlow Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* card skin — set by the chosen PE Style */
  --ink1:#7d2233;--ink2:#6f1d2c;--ink3:#4a1019;--acc:#e7b64b;--accs:#f3d689;--rib:#3a1008;
  --frame:linear-gradient(145deg,#e0a566,#a15c2b 50%,#7a441f 62%,#d68a4e); /* bronze */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.dark{background:radial-gradient(circle at 50% 0%,#2a2024,#120d0e);color:#fff}
button{font:inherit}
.wrap{max-width:940px;margin:0 auto;padding:24px 16px 60px}

/* loading / toast */
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:80px 0;color:var(--muted);font-size:14px}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--maroon);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#ffd9d9;color:#7a1414}

/* ── profile view (light) ───────────────────────────────────────── */
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.demo-tag{display:inline-block;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.yearlab{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--maroon)}
.cardteaser{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--ink1),var(--ink2) 55%,var(--ink3));border:1px solid #c9982f;border-radius:16px;padding:13px 18px;margin:6px 0 10px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.28),0 0 18px rgba(231,182,75,.4);flex-wrap:wrap;transition:background .3s}
.cardteaser::after{content:"";position:absolute;top:-60%;left:-70%;width:45%;height:220%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(9deg);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{left:-70%}62%,100%{left:150%}}
@media(prefers-reduced-motion:reduce){.cardteaser::after,.card,.cinner::after{animation:none}}
.ct-av{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);flex:none;position:relative;z-index:2;background:rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:20px;color:var(--accs)}
.ct-av img{width:100%;height:100%;object-fit:cover;display:block}
.ct-id{position:relative;z-index:2;min-width:150px;flex:1}
.ct-name{font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;line-height:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ct-tier{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--rib);background:var(--frame);padding:2px 8px;border-radius:20px}
.ct-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.ct-arch{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--accs);margin-top:3px}
.ct-stats{display:flex;gap:16px;position:relative;z-index:2;margin-left:6px}
.ct-stats div{text-align:center}.ct-stats b{font-family:var(--disp);font-size:18px;color:#fff;display:block;line-height:1}
.ct-stats span{font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.04em}
.ct-btn{margin-left:auto;position:relative;z-index:2;background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;font-family:var(--disp);font-weight:700;font-size:14px;text-decoration:none;padding:9px 16px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.25);border:none;cursor:pointer}
.ct-btn:hover{filter:brightness(1.06)}
.ct-btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.25)}50%{box-shadow:0 3px 8px rgba(0,0,0,.25),0 0 0 6px rgba(231,182,75,.25)}}
.goals{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 8px}
.goals .hd{font-family:var(--disp);font-weight:600;font-size:17px;margin:0 0 6px}
.goals .empty{font-size:12.5px;color:var(--muted)}
h3.sec{font-family:var(--disp);font-weight:600;font-size:22px;margin:30px 0 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sec .em{font-size:16px;width:31px;height:31px;border-radius:9px;display:inline-grid;place-items:center;background:var(--maroon-t)}
.seclede{font-size:12.5px;color:var(--muted);margin:0 0 13px}
.tap{font-size:10.5px;font-weight:600;font-family:var(--disp);color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.grid3,.grid4{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px 14px;cursor:pointer;transition:.15s;position:relative;text-align:left;width:100%;color:var(--ink)}
.tile:hover{box-shadow:0 5px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.tile .tnrow{display:flex;align-items:center;gap:6px}.tile .em{font-size:15px}.tile .tn{font-weight:600;font-size:13px}
.tile .tsub{font-size:11px;color:var(--muted);margin:1px 0 10px;min-height:13px}
.tile .plus{position:absolute;top:11px;right:12px;color:#c9c1c0;font-size:14px;line-height:1}
.track{display:flex;gap:4px}.track i{height:9px;border-radius:3px;flex:1;background:#ece7e6}
.tracklab{font-family:var(--disp);font-size:12px;font-weight:600;margin-top:6px;color:var(--muted)}
.rung{font-family:var(--disp);font-size:11px;color:var(--muted);margin-top:5px}
.measure{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1;color:#c9c1c0}.measure small{font-size:11px;color:var(--muted);font-weight:400}
.a-fit .track i.on{background:var(--fit)}.a-fund .track i.on{background:var(--fund)}.a-skill .track i.on{background:var(--skill)}.a-ap .track i.on{background:var(--ap)}
.fhero{background:var(--fit-t);border:1.5px solid var(--fit);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:12px;transition:.15s;width:100%;text-align:left;color:var(--ink)}
.fhero:hover{box-shadow:0 5px 16px rgba(232,115,12,.15)}
.fhero .fx{font-size:22px;flex:none}.fhero .fm{flex:1}.fhero .fm .n{font-weight:600;font-size:15px}.fhero .fm .s{font-size:12px;color:var(--ink-soft)}
.fhero .fv{font-family:var(--disp);font-weight:700;font-size:24px;color:var(--fit);text-align:right;line-height:1}.fhero .fv span{font-size:11px;color:var(--muted);font-weight:400;display:block}
.band{background:var(--ink);border-radius:14px;padding:15px 16px;cursor:pointer;color:#fff;transition:.15s;position:relative;text-align:left;width:100%;border:none}
.band:hover{box-shadow:0 6px 18px rgba(0,0,0,.18);transform:translateY(-1px)}
.band .bn{font-family:var(--disp);font-weight:700;font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.band .btrack{display:flex;gap:3px;margin-bottom:6px}.band .btrack i{height:7px;flex:1;border-radius:2px;background:#4a3b3e}.band .btrack i.on{background:#d7a6ec}
.band .blab{font-family:var(--disp);font-size:12px;color:#bfb0c4;font-weight:600}.band .plus{position:absolute;top:13px;right:14px;color:#9a8aa0;font-size:15px}
.foot{margin-top:22px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px;font-size:13px;color:var(--ink-soft);display:flex;gap:11px;align-items:center}.foot b{color:var(--maroon)}
.foot .arrow{font-family:var(--disp);font-size:24px;color:var(--maroon)}
.sec-glance,.sec-refl{color:var(--maroon)}.sec-fit{color:var(--fit)}.sec-fit .em{background:var(--fit-t)}.sec-fund{color:var(--fund)}.sec-fund .em{background:var(--fund-t)}.sec-skill{color:var(--skill)}.sec-skill .em{background:var(--skill-t)}.sec-ap{color:var(--ap)}.sec-ap .em{background:var(--ap-t)}.sec-rep{color:var(--rep)}.sec-rep .em{background:var(--rep-t)}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(22,18,19,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.ov.show{display:flex}
.ovcard{background:var(--card);color:var(--ink);border-radius:18px;max-width:470px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease;max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.ovcard .x{float:right;border:none;background:#f0eae9;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer;color:var(--ink-soft)}
.ovcard h4{font-family:var(--disp);font-weight:700;font-size:22px;margin:2px 0 2px;display:flex;align-items:center;gap:7px}.ovcard .om{font-size:12.5px;color:var(--muted);margin:0 0 15px}
.ovnow{background:var(--maroon-t);border-left:3px solid var(--maroon);border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:9px}
.ovnow .l{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--maroon);letter-spacing:.04em;margin-bottom:3px}.ovnow .t{font-size:13.5px;color:var(--ink);line-height:1.5}
.ovnext{border:1px dashed var(--line);border-radius:9px;padding:11px 14px}.ovnext .l{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:3px}.ovnext .t{font-size:13px;color:var(--ink-soft);line-height:1.5}
.lad{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:9px;align-items:flex-start}
.lad .lv{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--muted);flex:none;width:20px}
.ovfeeds{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.ovfeeds b{color:var(--ink-soft)}

/* ── card view (dark) ───────────────────────────────────────────── */
.back{display:inline-flex;align-items:center;gap:6px;color:#c8bcbe;text-decoration:none;font-size:13px;background:none;border:1px solid #3a2e31;border-radius:999px;padding:6px 14px;cursor:pointer}
.back:hover{border-color:#5a4a4e;color:#fff}
.hero{text-align:center;margin:10px 0 22px}
.hero .k{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--gold)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,52px);margin:6px 0 4px;letter-spacing:-.01em}
.hero p{color:#c8bcbe;font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.step{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.step .saved{font-size:11px;letter-spacing:.04em;color:#7fe0a8;text-transform:none;font-weight:600}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:420px){.styles{grid-template-columns:1fr}}
.sbtn{background:#241d20;border:1.5px solid #3a2e31;border-radius:14px;padding:15px 14px;cursor:pointer;transition:.15s;text-align:left;color:#fff;width:100%}
.sbtn:hover{border-color:#5a4a4e;transform:translateY(-1px)}
.sbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sbtn.sel{border-color:var(--acc);background:#2e2528;box-shadow:0 6px 18px rgba(231,182,75,.2)}
.sbtn[disabled]{opacity:.6;cursor:progress}
.sbtn .se{font-size:24px}.sbtn .sn{font-family:var(--disp);font-weight:700;font-size:16px;margin:5px 0 2px}
.sbtn .sd{font-size:11.5px;color:#c8bcbe;line-height:1.35}
.cardstage{display:flex;flex-direction:column;align-items:center;gap:14px;position:sticky;top:18px}
.card{width:min(360px,100%);border-radius:24px;padding:4px;background:var(--frame);box-shadow:0 26px 64px rgba(0,0,0,.55),0 0 30px rgba(231,182,75,.35);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-8px) rotate(.4deg)}}
.cinner{background:linear-gradient(160deg,var(--ink1),var(--ink2) 42%,var(--ink3));border-radius:20px;padding:17px 19px;position:relative;overflow:hidden;transition:.3s}
.cinner::after{content:"";position:absolute;top:-60%;left:-75%;width:55%;height:220%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.42),transparent);transform:rotate(9deg);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
.chd{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:700;font-size:11px;color:var(--acc);position:relative;z-index:2}
.ctier{font-family:var(--disp);font-weight:800;font-size:10.5px;letter-spacing:.06em;color:#2b1f12;background:var(--frame);padding:3px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.9);text-shadow:0 1px 0 rgba(255,255,255,.55);position:relative;overflow:hidden}
.ctier::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);animation:tshine 3.5s ease-in-out infinite}
@keyframes tshine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media(prefers-reduced-motion:reduce){.ctier::after{animation:none;display:none}}
.cwho{display:flex;align-items:center;gap:10px;margin-top:10px;position:relative;z-index:2}
.cav{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);background:rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--accs);flex:none}
.cav img{width:100%;height:100%;object-fit:cover;display:block}
.cname{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;word-break:break-word;color:#fff}
.cclass{font-size:11px;color:rgba(255,255,255,.72);margin-top:2px}
.crib{background:linear-gradient(90deg,var(--acc),var(--accs));border-radius:9px;padding:6px 13px;font-family:var(--disp);font-weight:700;color:var(--rib);margin:11px 0;display:flex;justify-content:space-between;align-items:center;font-size:18px;position:relative;z-index:2}
.crad{position:relative;z-index:2;margin:2px 0}
.rlabel{font-family:var(--disp);font-size:11px;letter-spacing:.04em;fill:rgba(255,255,255,.82);font-weight:600}
.rleg{position:absolute;right:4px;top:-2px;font-size:10px;color:rgba(255,255,255,.7);z-index:3}
.rlabel-off{fill:rgba(255,255,255,.45)}.rq{font-family:var(--disp);font-size:8px;font-weight:800;fill:rgba(255,255,255,.75)}
.cbuilds{margin:26px auto 6px;max-width:860px;background:#2a2124;border:1px solid #3a2e31;border-radius:18px;padding:18px 18px 12px;color:#f3ecec}
.cbuilds h3{margin:0 0 4px;font-family:var(--disp);font-size:18px}.cb-lede{margin:0 0 12px;font-size:13px;color:#c8bcbe}
.cb-row{padding:11px 0;border-top:1px solid #3a2e31}
.cb-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.cb-n{font-family:var(--disp);font-weight:800;font-size:15px}.cb-n small{font-weight:700;color:#e7b64b;margin-left:4px;font-size:11px}
.cb-b{font-weight:700;font-size:13.5px;white-space:nowrap}.cb-b i{font-weight:600;color:#c8bcbe}
.cb-w{margin:3px 0 7px;font-size:12.5px;color:#c8bcbe}
.cb-chips{display:flex;flex-wrap:wrap;gap:6px}
.cb-chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid #4a3c40;color:#c8bcbe}.cb-chip small{font-weight:600;opacity:.8}
.cb-chip.cbc-done{background:#1f9d5733;border-color:#1f9d57;color:#bfeccf}.cb-chip.cbc-now{background:#e7b64b33;border-color:#e7b64b;color:#f5dc9c}
.cb-key{display:flex;gap:8px;margin:10px 0 0}
.rnote{font-family:var(--body);font-size:10px;fill:rgba(255,255,255,.6)}
.cstat{display:flex;gap:7px;margin-top:6px;position:relative;z-index:2}
.cstat div{flex:1;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px;text-align:center}
.cstat b{font-family:var(--disp);font-size:19px;display:block;color:#fff}.cstat b small{font-size:11px;opacity:.65;margin-left:1px}.cstat span{font-size:9px;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.05em;display:block}.cstat em{font-style:normal;font-size:10px;color:var(--accs);display:block;margin-top:1px}
.cbadge{display:flex;gap:9px;justify-content:center;margin-top:11px;position:relative;z-index:2}
.cbadge{flex-wrap:nowrap;gap:5px;align-items:center;min-height:28px}
.cmore{font-family:var(--disp);font-weight:700;font-size:11px;color:rgba(255,255,255,.8);border:1.5px dashed rgba(255,255,255,.35);border-radius:999px;padding:4px 8px;white-space:nowrap}
.cnone{font-size:11px;color:rgba(255,255,255,.7);margin-left:4px}
.cbadge .bdg{width:28px;height:28px;font-size:13px}
.cfoot{margin-top:11px;text-align:center;font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--acc);position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}
.cardhint{font-size:12px;color:#c8bcbe;text-align:center;max-width:34ch;line-height:1.45}
.done{margin-top:34px;text-align:center}
.done .ct-btn{margin:0}

/* ── Lesson 1: strengths & challenges ───────────────────────────── */
.goals.l1 .l1btn{display:inline-block;margin:12px 0 2px}
.l1row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.l1row:first-of-type{border-top:none}
.l1row b{font-family:var(--disp);font-size:12px;flex:none;width:96px;padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--paper);border:1px solid var(--line)}
.chip.g{background:#e6f6ec;border-color:#bfe6cd}.chip.r{background:#fde8e8;border-color:#f3c2c2}.chip.none{color:var(--muted)}
.l1acts{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.lnk{background:none;border:none;color:var(--maroon);font-weight:600;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.back.light{color:var(--ink-soft);border-color:var(--line);background:#fff}.back.light:hover{color:var(--ink)}
.phero{margin:14px 0 4px}.phero .k,.sumhero .k{font-family:var(--disp);font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--maroon)}
.phero h1,.sumhero h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4.5vw,40px);margin:4px 0 6px;line-height:1.05}
.phero p,.sumhero p{color:var(--ink-soft);font-size:14px;max-width:60ch;margin:0 0 10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);font-family:var(--disp);font-weight:600}.legend .sep{color:var(--muted)}
.predict{padding-bottom:110px}
.pitem{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:.15s}
.pitem.a-fit{border-left-color:var(--fit)}.pitem.a-fund{border-left-color:var(--fund)}
.pitem.done{background:#fbfaf9}.pitem .tick{margin-left:auto;font-family:var(--disp);font-weight:700;color:var(--ap);opacity:0;transition:.15s}.pitem.done .tick{opacity:1}
.pihead{display:flex;align-items:center;gap:10px;margin-bottom:9px}.pihead .em{font-size:22px}.pt{font-weight:600;font-size:14.5px}.ps{font-size:11.5px;color:var(--muted)}
.tls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.tl{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font-family:var(--disp);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px}
.tl span{font-size:15px}
.tl.strength.on{background:#e6f6ec;border-color:#1f9d57;color:#0f7a41}.tl.neutral.on{background:#fff6dc;border-color:#e0a100;color:#7a5600}.tl.work-on.on{background:#fde8e8;border-color:#d64545;color:#8f1f1f}
.tl:focus-visible,.fq:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.fqs{display:flex;gap:6px;flex-wrap:wrap}
.fq{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.fq.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:16px;z-index:40;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.pbar .pcount{flex:1;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink-soft)}.pbar .pcount b{font-size:20px;color:var(--ink)}
.ptrack{height:6px;border-radius:3px;background:#ece7e6;margin-top:5px;max-width:320px}.ptrack i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--fit),var(--fund));transition:width .2s}
.pbar .ct-btn{margin:0}.pbar .ct-btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.sumhero{margin:20px 0 16px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.sumgrid{grid-template-columns:1fr}}
.sumcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;border-top:4px solid var(--line)}
.sumcard.g{border-top-color:#1f9d57}.sumcard.r{border-top-color:#d64545}
.sumcard h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0 0 8px}
.slist{list-style:none;margin:0;padding:0}.slist li{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.slist li:first-child{border-top:none}
.slist .em{font-size:18px}.slist .sf{margin-left:auto;font-size:11.5px;color:var(--muted)}
.sumcard .empty{font-size:13px;color:var(--muted);margin:0}
.sumnote{margin-top:14px;background:var(--maroon-t);border-left:3px solid var(--maroon);border-radius:0 12px 12px 0;padding:12px 16px;font-size:13px;color:var(--ink-soft)}.sumnote b{color:var(--maroon)}
.sumacts{display:flex;gap:18px;align-items:center;margin-top:18px;flex-wrap:wrap}.sumacts .ct-btn{margin:0}
.chead,.crowi{display:grid;grid-template-columns:28px 1fr 150px;gap:10px;align-items:center}
.chead{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:6px 14px;grid-template-columns:1fr 1fr 150px}
.chead span:first-child{display:none}
.crowi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:6px}
.crowi.a-fit{border-left-color:var(--fit)}.crowi.a-fund{border-left-color:var(--fund)}
.crowi .em{font-size:18px}.crowi .ct b{display:block;font-size:13.5px}.crowi .ct span{font-size:12px;color:var(--ink-soft)}
.crowi .cv{font-family:var(--disp);font-weight:700;text-align:right}.pending{font-size:11.5px;color:var(--muted);font-weight:500}
@media(max-width:520px){.chead,.crowi{grid-template-columns:28px 1fr}.chead{grid-template-columns:1fr}.chead span:last-child{display:none}.crowi .cv{grid-column:2;text-align:left}}

/* ── sign-in ─────────────────────────────────────────────────────── */
.signin{max-width:440px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 28px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.08)}
.signin .k{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--maroon)}
.signin h1{font-family:var(--disp);font-weight:800;font-size:34px;margin:6px 0 8px;line-height:1}
.signin p{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px}
.signin .note{background:var(--maroon-t);border-left:3px solid var(--maroon);border-radius:0 9px 9px 0;padding:9px 12px;font-size:13px;text-align:left}
.gbtn{display:flex;justify-content:center;min-height:44px;margin:6px 0 14px}
.signin .small{margin:0;font-size:11.5px}

/* ── messages for non-student states ────────────────────────────── */
.msg{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 28px;text-align:center}
.msg .big{font-size:38px}
.msg h2{font-family:var(--disp);font-weight:800;font-size:24px;margin:8px 0 6px}
.msg p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
.msg code{background:var(--paper);padding:2px 7px;border-radius:6px;font-size:13px;color:var(--ink)}
.msg .btn{display:inline-block;margin-top:10px;background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;border:none;font-family:var(--disp);font-weight:700;font-size:14px;padding:10px 20px;border-radius:11px;cursor:pointer;text-decoration:none}
.small{font-size:11.5px;color:var(--muted);text-align:center;margin-top:30px;line-height:1.5}

/* ── v3: results / goals / plan / teacher ── */
.planstrip{background:linear-gradient(135deg,var(--maroon),#8a2435);border-radius:15px;padding:13px 15px;margin:14px 0 4px;color:#fff;box-shadow:0 4px 14px rgba(111,29,44,.22)}
.planstrip .ps-h{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em;margin-bottom:9px}
.planstrip .ps-row{display:flex;gap:8px;flex-wrap:wrap}
.ps-btn{flex:1 1 auto;min-width:0;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 12px;font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.ps-btn:hover{background:rgba(255,255,255,.24)}
.ps-btn.primary{background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;border-color:transparent}
.goalchips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 2px}
.goalchips .gc-h{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--maroon)}
.gchip{background:var(--gold);color:#3a1008;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px}
.dlt{font-family:var(--disp);font-weight:700;font-size:12px;margin-left:7px;vertical-align:middle}
.dlt.up{color:var(--ap)}.dlt.down{color:#c0392b}
.tile.has .measure{color:var(--ink)}
.lbar{display:flex;gap:3px;margin:8px 0 2px}
.lbar i{height:7px;flex:1;border-radius:2px;background:var(--line);position:relative}
.lbar i.on{background:var(--fund)}
.lbar i.mk:after{content:"";position:absolute;inset:-3px -1px;border:1.5px dashed var(--gold);border-radius:3px}
.tile.a-fund.below .lbar i.on{background:#c0392b}.tile.a-fund.meet .lbar i.on{background:var(--fit)}.tile.a-fund.ok .lbar i.on{background:var(--ap)}
.btrack.ap{display:flex;gap:3px;margin:8px 0 6px}.btrack.ap i{height:7px;flex:1;border-radius:2px;background:var(--line)}.btrack.ap i.on{background:var(--ap)}
.tile.a-ap.below .btrack.ap i.on{background:#c0392b}.tile.a-ap.meet .btrack.ap i.on{background:var(--fit)}
.band.ok .btrack i.on{background:#7fe0a6}.band.meet .btrack i.on{background:#f3c07a}.band.below .btrack i.on{background:#f0a097}
/* overlay trend */
.ovtrend{display:flex;gap:8px;margin-top:10px}
.ovtrend .ovt{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.ovtrend .ovt span{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.ovtrend .ovt b{font-family:var(--disp);font-size:20px;color:var(--ink)}
.lad.here{border-color:var(--fund);background:var(--fund-t)}
.lad .youre{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:10px;color:var(--fund);align-self:center;white-space:nowrap}
/* entry + goals + plan forms */
.phero.tight{margin:8px 0 2px}
.cpick{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:4px}
.cpick select,.lvsel,.daysin{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.enform{display:flex;flex-direction:column;gap:7px;margin:8px 0 80px}
.enrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.enrow .en-n{font-family:var(--disp);font-weight:700;font-size:14px}
.enrow .en-in{display:flex;align-items:center;gap:8px}
.enrow .en-in small{color:var(--muted);font-size:11px;white-space:nowrap}
.enrow input[type=number]{width:78px;font-family:var(--disp);font-weight:700;font-size:17px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--ink)}
.enrow .en-mile{gap:5px}
.enrow .en-mile input[type=number]{width:50px;text-align:center}
.enrow .en-mile b{font-family:var(--disp);font-weight:800;color:var(--muted);font-size:17px}
.enrow input:focus,.goalrow input:focus,textarea:focus,select:focus{outline:2px solid var(--maroon);outline-offset:1px}
.goalrow{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.goalrow .gr-n{font-family:var(--disp);font-weight:700;font-size:14px}
.goalrow input{width:100%;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.fchip{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:8px 13px;font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft)}
.fchip.on{background:var(--fit-t);border-color:var(--fit);color:var(--fit)}
textarea{width:100%;font-family:var(--body);font-size:14px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink);resize:vertical;margin-top:4px}
.daysin{width:80px;margin-top:4px}
/* teacher table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:10px}
.tablewrap table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tablewrap th{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tablewrap th.num,.tablewrap td.num{text-align:center}
.tablewrap td{padding:9px 12px;border-bottom:1px solid var(--line)}
.tablewrap tbody tr:last-child td{border-bottom:none}
.tablewrap td.name{font-weight:600}.tablewrap td.sec{color:var(--muted);font-size:12px}
.tablewrap .muted{color:#c9c1c0}
.pill{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:7px;font-family:var(--disp);font-weight:700;font-size:13px;padding:0 6px}
.pill.g-hi{background:var(--ap-t);color:var(--ap)}.pill.g-mid{background:var(--fit-t);color:var(--fit)}.pill.g-lo{background:#f9e5e2;color:#c0392b}
.minib{background:var(--maroon-t);color:var(--maroon);border:none;border-radius:8px;font-family:var(--disp);font-weight:700;font-size:12px;padding:6px 10px;cursor:pointer}
.minib:hover{background:#ecd5d9}
/* ── units strip on the hub ── */
.sec-units{color:var(--maroon)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ucard{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s}
.ucard:not([disabled]):hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ucard.now{border:2px solid var(--maroon);background:linear-gradient(135deg,#fff,var(--maroon-t))}
.ucard.next{border:1.5px solid var(--gold)}
.ucard.later{opacity:.55;cursor:default}
.ucard.past{background:var(--paper)}
.u-e{font-size:26px;flex:none}.u-b{flex:1;display:flex;flex-direction:column;min-width:0}
.u-st{font-family:var(--disp);font-weight:800;font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.ucard.now .u-st{color:var(--maroon)}.ucard.next .u-st{color:#926410}
.u-n{font-family:var(--disp);font-weight:800;font-size:17px;line-height:1.15}
.u-d{font-size:12px;color:var(--muted)}
.u-go{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--maroon)}
.archlink{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.archlink b{font-family:var(--disp);font-size:15px}.archlink span:not(.sg-go){flex:1;color:var(--muted);font-size:13px}
/* ── fitness space: numbered steps ── */
.fsteps{display:flex;flex-direction:column;gap:8px}
.fstep{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;transition:.15s}
.fstep:hover{border-color:var(--fit);box-shadow:0 4px 14px rgba(232,115,12,.12)}
.fs-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:15px;background:var(--fit-t);color:var(--fit)}
.fstep.fdone .fs-n{background:#e4f5ec;color:#15724a}
.fs-b{flex:1;display:flex;flex-direction:column;min-width:0}
.fs-t{font-family:var(--disp);font-weight:800;font-size:15.5px}
.fs-s{font-size:12.5px;color:var(--muted)}
.fs-go{font-family:var(--disp);font-weight:800;font-size:13px;color:var(--maroon);background:var(--maroon-t);border-radius:999px;padding:5px 12px;white-space:nowrap}
.fstep:not(.fdone) .fs-go{background:var(--maroon);color:#fff}
.goals.l1{margin-top:12px}
/* ── compare: reflect + archive ── */
.creflect{background:#fff;border:1px solid var(--line);border-top:4px solid var(--maroon);border-radius:14px;padding:4px 16px 16px;margin-top:20px}
.creflect.cdone{border-top-color:#15724a}
.creflect h3.sec{margin-top:12px}
.cr-q{display:block;font-family:var(--disp);font-weight:700;font-size:14px;margin:10px 0 0}
.cr-act{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}.cr-act .ct-btn{margin:0}
.cr-act span{font-size:12.5px;color:var(--muted)}
/* ── archive ── */
.arc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.arc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;font-size:15px}
.arc-h b{font-family:var(--disp)}.arc-d{font-family:var(--disp);font-size:12px;color:var(--muted)}
.arc-q{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--maroon);margin-top:8px}
.arc p{margin:2px 0 8px;font-size:14px;color:var(--ink-soft)}
.arc-lv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}.arc-lv b{color:var(--ink)}
/* ── unit space ── */
.founds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.found{display:flex;gap:12px;align-items:center;background:var(--fund-t);border:1.5px solid var(--fund);border-radius:14px;padding:12px 15px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.fd-e{font-size:26px}.fd-b{flex:1;display:flex;flex-direction:column}
.fd-t{font-family:var(--disp);font-weight:800;font-size:14px;color:#0b6a62}.fd-s{font-size:12.5px;color:var(--ink-soft)}
.usteps{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.usteps{grid-template-columns:1fr}}
.ustep{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:13px;color:var(--ink-soft)}
.ustep b{display:block;font-family:var(--disp);font-size:14.5px;color:var(--ink);margin-bottom:2px}
.us-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--skill-t);color:var(--skill);display:grid;place-items:center;font-family:var(--disp);font-weight:800}
.rgrid{display:flex;flex-direction:column;gap:10px}
.rcrit{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.rc-h b{font-family:var(--disp);font-size:16px}
.rc-std{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--skill);background:var(--skill-t);border-radius:999px;padding:2px 9px;white-space:nowrap}
.rc-lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:600px){.rc-lv{grid-template-columns:1fr 1fr}}
.rlv{display:flex;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--ink);min-height:62px;cursor:pointer;font:inherit}
.rlv:hover{border-color:var(--skill)}
.rl-d{font-size:13.5px;line-height:1.35;font-weight:600}
.rlv.on{background:var(--skill);border-color:var(--skill);color:#fff}
.tresult{display:flex;justify-content:space-between;align-items:center;margin:14px 0 90px;background:var(--ink);color:#fff;border-radius:13px;padding:13px 16px;font-family:var(--disp);font-weight:700}
.tresult b{color:var(--gold)}
/* ── workout builder: a real training plan — rows, sets × reps, drag ⠿ to arrange ── */
.inclass{display:flex;align-items:center;flex-wrap:wrap;gap:7px;background:var(--fund-t);border:1px solid #bfe6e2;border-radius:12px;padding:10px 13px;margin:10px 0 2px}
.inclass .ic-h{font-family:var(--disp);font-weight:800;font-size:12.5px;color:#0b6a62}
.inclass .ic-chip{background:#fff;border:1px solid #bfe6e2;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:#0b6a62}
.inclass .ic-note{font-size:11.5px;color:var(--muted)}
.wkcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--maroon);border-radius:16px;padding:4px 10px 6px;margin:16px 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.wkcard-h{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 10px;font-family:var(--disp);font-weight:800;font-size:18px}
.wkcard-n{font-size:12px;color:var(--muted);font-weight:700;background:var(--paper);border-radius:999px;padding:3px 10px}
.wkpart{border-top:1px solid var(--line);padding:12px 4px 14px}
.wk-h{font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:8px;color:var(--maroon)}
.wk-h small{font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted)}
.wk-list{display:flex;flex-direction:column;gap:6px;min-height:4px}

/* five-section plan (class "Build your plan") */

.wk-cbtn.on{background:var(--maroon);border-color:var(--maroon);color:#fff}.wk-cbtn.on small{color:#f3d7dc}
.wk-field{display:flex;flex-direction:column;gap:4px;margin:10px 0 2px;font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--ink)}

.wr-ctl{display:flex;align-items:center;gap:8px;flex:none}

.wr-int{border:1px solid var(--line);border-radius:8px;padding:6px 6px;font-family:var(--disp);font-size:12.5px;font-weight:800;background:#fff;cursor:pointer}

.wkcard-n.ok{color:#15724a;background:#e4f5ec}
.wk-equip{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:12px}
.wk-eh{font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:8px}.wk-eh small{font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted)}
.eq-chips{display:flex;flex-wrap:wrap;gap:6px}
.eq-chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}

@media(max-width:640px){.wk-row{flex-wrap:wrap}.wr-n{flex:1 1 calc(100% - 70px)}.wr-ctl{order:3;width:100%;padding-left:28px;flex-wrap:wrap}.wr-x{order:2}}
/* main-page fitness summary */
.fsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.fsum-t{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-left:3px solid var(--fit-t);border-radius:12px;padding:9px 11px;cursor:pointer;font:inherit;color:var(--ink)}

.wr-est{font-family:var(--disp);font-weight:800;font-size:12px;color:#2f6df0;background:var(--skill-t);border-radius:999px;padding:4px 9px;white-space:nowrap}
/* workout-mode launchers */
.wo-cta{display:flex;align-items:center;gap:13px;width:100%;margin:12px 0 4px;text-align:left;cursor:pointer;font:inherit;color:#fff;border:0;border-radius:16px;padding:13px 16px;background:linear-gradient(120deg,#1d1416,#3a1a22 60%,var(--maroon));box-shadow:0 8px 22px rgba(0,0,0,.18)}
.woc-i{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3a1008;font-size:17px}
.woc-b{flex:1;display:flex;flex-direction:column}.woc-b b{font-family:var(--disp);font-size:18px}.woc-b span{font-size:12.5px;color:#e9d9dc}
.woc-go{font-family:var(--disp);font-weight:800;color:#3a1008;background:var(--gold);border-radius:999px;padding:6px 15px}
.wo-launch{float:right;margin-top:2px;font-family:var(--disp);font-weight:800;font-size:13.5px;color:#3a1008;background:var(--gold);border:0;border-radius:999px;padding:8px 15px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15)}
/* workout mode */
.wo{max-width:640px;margin:0 auto;padding:14px 16px 40px;color:#fff;min-height:100vh}
.wo-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.wo-x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer}
.wo-tt{flex:1;font-family:var(--disp);font-weight:800;letter-spacing:.2em;font-size:12px;color:var(--gold)}
.wo-edit{font-family:var(--disp);font-weight:800;font-size:13px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;cursor:pointer}
.wo-edit.big{display:block;width:100%;margin-top:10px;padding:12px}

.wo-go{font-family:var(--disp);font-weight:800;font-size:19px;color:#3a1008;background:linear-gradient(145deg,#f3d689,#e7b64b);border:0;border-radius:16px;padding:15px 26px;cursor:pointer;box-shadow:0 8px 22px rgba(231,182,75,.3)}
.wo-go.wide{display:block;width:100%;margin-top:18px}
.wo-go[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.wo-eq{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:11px 14px;font-size:14px;color:#e9dfe1;margin:16px 0 4px}.wo-eq b{color:var(--gold)}
.wo-secb{margin-top:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-left:5px solid var(--sec);border-radius:14px;padding:11px 14px}
.wo-sh{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--disp);font-weight:800;font-size:17px;margin-bottom:4px}.wo-sh b{font-size:13px;color:var(--sec);filter:brightness(1.3)}
.wo-note{font-size:13px;color:#f1e3c4;margin-bottom:4px}
.wo-li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.wo-li:first-of-type{border-top:0}.wo-ln{font-weight:700;font-size:15px}
.wo-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.wo-chips span{font-family:var(--disp);font-weight:800;font-size:15px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 13px}
.wo-chips.sm{margin:0;justify-content:flex-end}.wo-chips.sm span{font-size:12px;padding:3px 9px}
.wo-play{text-align:center;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--sec) 35%,transparent),transparent 60%)}
.wo-prog{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}.wo-prog i{display:block;height:100%;background:var(--sec);border-radius:999px;transition:width .3s}
.wo-cnt{font-family:var(--disp);font-weight:800;font-size:14px;color:#d9cdd0}
.wo-sec{display:inline-block;margin-top:10px;font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--sec);border-radius:999px;padding:5px 14px}
.wo-name{font-family:var(--disp);font-weight:800;font-size:clamp(36px,10vw,64px);line-height:1;margin:14px 0 4px;word-break:break-word}
.wo-tip{display:inline-block;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 14px;font-size:14px;margin:2px 0 6px}
.wo-timer{position:relative;width:210px;height:210px;margin:14px auto 8px}
.wo-timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.wo-rbg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:9}
.wo-rfg{fill:none;stroke:var(--sec);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.wo-tin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wo-time{font-family:var(--disp);font-weight:800;font-size:54px;line-height:1}
.wo-tl{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#d9cdd0;margin-top:4px}
.wo-ctl{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}
.wo-c{font-family:var(--disp);font-weight:800;font-size:15px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;cursor:pointer;min-width:60px}
.wo-c.main{background:var(--sec);border-color:var(--sec);min-width:170px}.wo-c.main.on{background:rgba(255,255,255,.18)}
.wo-c[disabled]{opacity:.4}
.wo-sets{display:flex;gap:12px;justify-content:center;margin:12px 0 12px}
.wo-dot{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-family:var(--disp);font-weight:800;font-size:16px;cursor:pointer}
.wo-dot.on{background:var(--sec);border-color:var(--sec);box-shadow:0 0 12px var(--sec)}
.wo-setb{font-family:var(--disp);font-weight:800;font-size:18px;color:#fff;background:var(--sec);border:0;border-radius:16px;padding:14px 26px;cursor:pointer}
.wo-setb[disabled]{opacity:.55;cursor:default}
.wo-alldone{font-family:var(--disp);font-weight:800;color:#9be7b9;font-size:16px}
.wo-cheer{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--gold);margin:16px 0 6px}
.wo-nav{display:flex;gap:10px;margin-top:14px}
.wo-nb{flex:1;font-family:var(--disp);font-weight:800;font-size:18px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:15px;cursor:pointer}
.wo-nb.next{flex:2;background:#fff;color:#1d1416;border-color:#fff}.wo-nb[disabled]{opacity:.35}
.wo-nb.pulse{animation:wopulse 1.2s ease-in-out infinite}

.wo-upnext{margin-top:12px;font-size:13.5px;color:#cbbec1}.wo-upnext b{color:#fff}

.wo-burst{font-size:34px;letter-spacing:8px;animation:woburst .8s ease-out}
@keyframes woburst{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.wo-burst,.wo-nb.pulse,.wo-rfg{animation:none;transition:none}}
.wo-q{font-family:var(--disp);font-weight:800;font-size:17px;margin:20px 0 8px}.wo-q small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:#e7b64b}
.wo-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wo-pb{font-family:var(--disp);font-weight:800;font-size:15px;color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);border-radius:14px;padding:11px 15px;cursor:pointer}
.wo-pb.on{background:var(--gold);color:#3a1008;border-color:var(--gold)}
.wo-tipb{font-size:16px !important;color:#fff !important;max-width:40ch;margin:10px auto 6px}

.hw-how{font-size:13.5px;color:var(--ink);background:#fbf3e2;border-radius:10px;padding:8px 12px;margin-bottom:8px}
.hw-manual summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-bottom:6px}

/* ── kid-friendly layer: greeting + next step, badges, card tiers, celebration ── */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.hello-l{display:flex;flex-direction:column;gap:8px;min-width:0}
.hi{font-family:var(--disp);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.05;margin:0}
.nextstep{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:#fff;border:2px solid var(--gold);border-radius:999px;padding:6px 6px 6px 14px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 4px 14px rgba(231,182,75,.25);transition:transform .08s}
.ns-l{font-size:11.5px;font-weight:700;color:var(--muted)}
.ns-t{font-family:var(--disp);font-weight:800;font-size:15px}

@media (max-width:520px){.hi{font-size:24px}.hello{gap:8px}.nextstep{align-self:stretch;justify-content:space-between;padding:6px 6px 6px 14px}.nextstep .ns-l{display:none}.ns-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shelf{gap:4px}.bdg{width:29px;height:29px;font-size:14px}}
.shelfrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 4px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:14px}

.bdg.got{filter:none;opacity:1;border:2px solid #c9982f;background:radial-gradient(circle at 40% 35%,#fff6dc,#f3d689 60%,#c9982f);box-shadow:0 2px 8px rgba(201,152,47,.45)}
.bdg:hover{transform:scale(1.12)}
.card .bdg{border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.2)}.card .bdg.got{border-color:var(--acc);background:radial-gradient(circle at 40% 35%,#fff3d6,var(--acc) 62%,#b9871f)}
.ovbadge{width:84px;height:84px;margin:4px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:#f1eeec;border:2px dashed #d8cfcd;filter:grayscale(1);opacity:.6}

.fprog{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.fp-bar{flex:1;max-width:360px;height:12px;border-radius:999px;background:#efe6dd;overflow:hidden}
.fp-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--fit),var(--gold));transition:width .5s}
.fprog span{font-family:var(--disp);font-weight:800;font-size:13.5px;color:var(--fit)}
.fprog.all span{color:#15724a}.fprog.all .fp-bar i{background:linear-gradient(90deg,#1f9d57,var(--gold))}
.burst{position:fixed;left:50%;top:42%;width:0;height:0;z-index:80;pointer-events:none}
