function packReduced() { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
function packWire() {
  packPick = null; packStage = 'sealed';
  const pack = $('#pkpack'), strip = $('#pkstrip');
  let x0 = null, prog = 0, dragged = false;
  pack.addEventListener('pointerdown', e => { if (packStage !== 'sealed') return; x0 = e.clientX; prog = 0; dragged = false; try { pack.setPointerCapture(e.pointerId); } catch (er) {} });
  pack.addEventListener('pointermove', e => {
    if (x0 == null || packStage !== 'sealed') return;
    prog = Math.max(0, Math.min(1, (e.clientX - x0) / (pack.offsetWidth * 0.75)));
    if (prog > 0.05) dragged = true;
    strip.style.setProperty('--tear', (prog * 100).toFixed(0) + '%');
    strip.style.transform = 'rotate(' + (-prog * 8).toFixed(1) + 'deg) translateY(' + (-prog * 8).toFixed(1) + 'px)';
    if (prog > 0.6) { x0 = null; packRip(); }
  });
  const end = () => { if (x0 == null) return; x0 = null; if (packStage === 'sealed') { strip.style.transform = ''; strip.style.setProperty('--tear', '0%'); } };
  pack.addEventListener('pointerup', end); pack.addEventListener('pointercancel', end);
  pack.addEventListener('click', () => { if (packStage === 'sealed' && !dragged) { pack.classList.add('pk-shake'); setTimeout(packRip, packReduced() ? 0 : 420); } dragged = false; });
  $('#pkgrid').addEventListener('click', e => { const c = e.target.closest('.pk-card'); if (c && packStage === 'open') packChoose(c.dataset.k === packPick ? null : c.dataset.k); });
  $('#pkno').addEventListener('click', () => packChoose(null));
  $('#pkyes').addEventListener('click', packConfirm);
}
function packRip() {
  if (packStage !== 'sealed') return; packStage = 'ripping';
  const pack = $('#pkpack'), grid = $('#pkgrid'), stage = $('#pkstage'), quick = packReduced();
  $('#pkhint').hidden = true;
  pack.classList.remove('pk-shake'); pack.classList.add('ripped');
  try { if (navigator.vibrate) navigator.vibrate([20, 40, 30]); } catch (e) {}
  setTimeout(() => {
    const pr = pack.getBoundingClientRect();
    pack.hidden = true; grid.hidden = false; stage.classList.add('dealt');
    const cx2 = pr.left + pr.width / 2, cy2 = pr.top + pr.height / 2;
    grid.querySelectorAll('.pk-card').forEach(c => {
      const r = c.getBoundingClientRect();
      c.style.setProperty('--sx', (cx2 - (r.left + r.width / 2)).toFixed(0) + 'px');
      c.style.setProperty('--sy', (cy2 - (r.top + r.height / 2)).toFixed(0) + 'px');
    });
    grid.classList.add(quick ? 'shown' : 'dealing');
    const total = quick ? 0 : 700 + 8 * 110 + 650;
    setTimeout(() => {
      grid.classList.remove('dealing'); grid.classList.add('shown'); packStage = 'open';
      grid.querySelectorAll('.pk-card').forEach(c => c.disabled = false);
      $('#pk-h').textContent = 'Which one is you?';
      $('#pk-p').textContent = 'Tap a card to pick it. None is “better”: choose the one that sounds like you. You can swap later.';
    }, total);
  }, quick ? 0 : 600);
}
function packChoose(k) {
  packPick = k;
  const grid = $('#pkgrid'), bar = $('#pkbar');
  grid.classList.toggle('picking', !!k);
  grid.querySelectorAll('.pk-card').forEach(c => { const on = c.dataset.k === k; c.classList.toggle('pk-sel', on); c.setAttribute('aria-pressed', on); });
  bar.hidden = !k;
  if (k) $('#pkbar-t').innerHTML = '<span>' + SKINS[k].e + '</span> <b>' + esc(state.styles[k]) + '</b>';
}
async function packConfirm() {
  const k = packPick; if (!k || packStage !== 'open') return;
  const yes = $('#pkyes'); yes.disabled = true; yes.textContent = 'Saving…'; packStage = 'saving';
  try {
    const res = await call('saveStyle', { style: k });
    state.student.style = res.style;
    const c = document.querySelector('.pk-card.pk-sel'); if (c && !packReduced()) c.classList.add('pk-fly');
    setTimeout(() => { show('card'); window.scrollTo(0, 0); celebrate(SKINS[k].e); toast('You’re ' + state.styles[k] + '! This is your card now.'); }, packReduced() ? 0 : 560);
  } catch (e) {

  }
}

async function woSave() {

function woHandle(e) {
  const nIn = $('#wo-num'); if (nIn) wo.num = nIn.value.trim().slice(0, 40); // keep the typed number and change across re-renders
  const cIn = $('#wo-chg'); if (cIn) wo.chg = cIn.value.trim().slice(0, 160);
  const dot = e.target.closest('[data-dot]');
  if (dot) { const it = wo.list[wo.i], k = +dot.dataset.dot; wo.sets = (k < wo.sets) ? k : k + 1; woStop(); wo.rest = false; wo.total = wo.left = woKind(it) === 'interval' ? (parseSecs(it.reps) || 30) : 0; return show('workout'); }
  const id = (e.target.closest('button[id]') || {}).id, pk = e.target.closest('[data-wo]');
  if (pk) { wo[pk.dataset.wo] = pk.dataset.v; if (pk.dataset.wo === 'where' && pk.dataset.v === 'class') wo.who = ''; return show('workout'); }
  if (!id) return;
  const n = wo.list.length;
  if (id === 'wo-exit') { if (wo.stage === 'go') { woStop(); woWakeOff(); wo.stage = 'overview'; return show('workout'); } const f = wo.from; woStop(); woWakeOff(); wo = null; return show(f === 'profile' ? 'profile' : 'fitness'); }
  if (id === 'wo-edit') { woStop(); woWakeOff(); wo = null; if (!planDirty()) planDraft = null; lastHub = 'fitness'; return show('plan'); }
  if (id === 'wo-start' || id === 'wo-start2') { wo.stage = 'go'; wo.i = 0; woReset(); woWakeOn(); return show('workout'); }
  if (id === 'wo-play') { if (wo.running) woStop(); else { if (wo.left <= 0) wo.left = wo.total; woRun(); } return show('workout'); }
  if (id === 'wo-skiprest') { woStop(); wo.left = 0; wo.running = true; woTick(); return; }
  if (id === 'wo-reset') { const keep = wo.sets; woReset(); wo.sets = keep; return show('workout'); }
  if (id === 'wo-plus') { wo.left += 30; wo.total += 30; return show('workout'); }
  if (id === 'wo-set') { const nS = parseInt(wo.list[wo.i].sets, 10) || 0; woStop(); wo.rest = false; wo.total = wo.left = 0; wo.sets = Math.min(nS, wo.sets + 1); if (woKind(wo.list[wo.i]) === 'reps' && wo.sets < nS) woStartRest(REST.strength); return show('workout'); }
  if (id === 'wo-prev') { if (wo.i > 0) { wo.i--; woReset(); } return show('workout'); }
  if (id === 'wo-next') { if (wo.i < n - 1) { wo.i++; woReset(); } else { woStop(); woWakeOff(); wo.stage = 'done'; setTimeout(() => celebrate('🏆'), 150); } return show('workout'); }
  if (id === 'wo-save') return woSave();
  if (id === 'wo-skip' || id === 'wo-back') { wo = null; return show('fitness'); }
}

    app.innerHTML = predictView(state);
    app.addEventListener('click', e => { const t = e.target.closest('.tl,.fq'); if (!t) return; if (t.dataset.rating) pick(t.dataset.k, 'rating', t.dataset.rating); else pick(t.dataset.k, 'freq', t.dataset.freq); });
    wire('psave', savePrediction); wire('toprofile', () => show(lastHub));
  } else if (v === 'summary') {
    app.innerHTML = summaryView(state);
    wire('toprofile', () => show(lastHub)); wire('topredict', () => show('predict'));
  } else if (v === 'compare') {
    app.innerHTML = compareView(state);
    wire('toprofile', () => show(lastHub)); wire('topredict', () => show('predict')); wire('crsave', saveCompareUI);
  } else if (v === 'pack') {
    app.innerHTML = packView(state);
    wire('toprofile', () => show('profile')); wire('tocard', () => show('card'));
    packWire(); window.scrollTo(0, 0);
  } else if (v === 'card') {
    app.innerHTML = cardView(state);
    wire('repack', () => show('pack'));
    $('#styles').addEventListener('click', e => { const btn = e.target.closest('.sbtn'); if (btn) choose(btn.dataset.k); });
    $('#toprofile').addEventListener('click', () => show('profile'));
    $('#toprofile2').addEventListener('click', () => show('profile'));
    onWrap(e => { const t = e.target.closest('[data-ov]'); if (t) openOv(t.dataset.ov); });
  } else if (v === 'entry') {
    app.innerHTML = entryView(state);
    wire('toprofile', () => show(lastHub)); wire('ensave', saveEntry);
    const cp = $('#encp'); if (cp) cp.addEventListener('change', () => { entryCp = cp.value; show('entry'); });
  } else if (v === 'goals') {
    app.innerHTML = goalsView(state);
    wire('toprofile', () => show(lastHub)); wire('gsave', saveGoalsUI);
    const gc = $('#goalchips2'); if (gc) gc.addEventListener('click', e => { const c = e.target.closest('.goalchip'); if (c) { const k = c.getAttribute('data-g'); goalSel[k] = !goalSel[k]; show('goals'); } });
    document.querySelectorAll('.gslider').forEach(r => r.addEventListener('input', () => { const k = r.getAttribute('data-key'), meta = goalMetaFor(k), lab = $('#glb-' + k); if (lab && meta) lab.textContent = fmtMetric(meta, Number(r.value)); }));
  } else if (v === 'plan') {
    app.innerHTML = planView(state);
    wire('toprofile', () => leavePlan(() => show(lastHub))); wire('psaveplan', savePlanUI); wire('toeditgoals', () => leavePlan(() => show('goals'))); wire('wk-go', savePlanAndGo);
    wire('rn-use', () => { const b = readBackup(); if (b) { planDraft = normPlan(b.plan); planRestored = ''; planChanged(); show('plan'); } });
    wire('rn-drop', () => { dropBackup(); planRestored = ''; show('plan'); });
    planChanged(); // status line + backup + autosave reflect whatever just changed
    if (planRestored === 'auto' && planDirty() && !planSaving) autoSavePlan(); // brought-back edits save straight away
    const w = app.querySelector('.wrap');
    if (w) {
      w.addEventListener('click', e => {
        const ch = p => p === 'strength' ? planDraft.sChoice : (p === 'focus' ? planDraft.fChoice : '');
        const push = (part, n) => { if (planDraft[part].length >= WK_MAX_ROWS) return; const d = wkDefaults(part, ch(part)); planDraft[part].push({ n: n.slice(0, 40), sets: d.sets, reps: d.reps, min: d.min, int: d.int }); };
        const add = e.target.closest('[data-add]'); if (add) { syncPlanFromDom(); push(add.dataset.add, add.dataset.n); return show('plan'); }
        const rm = e.target.closest('[data-rm]'); if (rm) { const row = rm.closest('.wk-row'), list = row && row.parentNode; if (list) { const idx = Array.prototype.indexOf.call(list.querySelectorAll('.wk-row'), row), part = list.getAttribute('data-part'); syncPlanFromDom(); planDraft[part].splice(idx, 1); } return show('plan'); }
        const own = e.target.closest('[data-own]'); if (own) { const inp = w.querySelector('.wk-owni[data-part="' + own.dataset.own + '"]'); const v2 = inp && inp.value.trim(); if (v2) { syncPlanFromDom(); push(own.dataset.own, v2); show('plan'); } return; }
        const cho = e.target.closest('[data-choose]'); if (cho) { syncPlanFromDom(); const k = cho.dataset.choose === 'strength' ? 'sChoice' : 'fChoice'; if (planDraft[k] !== cho.dataset.val) { planDraft[k] = cho.dataset.val; Object.keys(wkOpen).forEach(x => wkOpen[x] = false); wkOpen[cho.dataset.choose] = true; if (k === 'sChoice') { const d = wkDefaults('strength', cho.dataset.val); planDraft.strength.forEach(r => { const isTime = /s$|sec|min|:/.test(String(r.reps).trim()); if (cho.dataset.val === 'endurance' && !isTime) r.reps = d.reps; if (cho.dataset.val === 'strength' && isTime) r.reps = d.reps; }); } } return show('plan'); }
        const day = e.target.closest('[data-day]'); if (day) { syncPlanFromDom(); planDraft.days[day.dataset.day] = !planDraft.days[day.dataset.day]; return show('plan'); }
        if (e.target.closest('#wk-eqadd')) { const i = $('#wk-eqi'), v3 = i && i.value.trim(); if (v3) { syncPlanFromDom(); planDraft.equip = (planDraft.equip || []); if (planDraft.equip.length < 20 && planDraft.equip.indexOf(v3) === -1) planDraft.equip.push(v3.slice(0, 30)); show('plan'); } return; }
        const eqr = e.target.closest('[data-eqrm]'); if (eqr) { syncPlanFromDom(); planDraft.equip.splice(+eqr.dataset.eqrm, 1); return show('plan'); }
        if (e.target.closest('#hwf-save')) { logSessionUI(); return; }
        const lr = e.target.closest('[data-logrm]'); if (lr) { syncPlanFromDom(); const k = lr.dataset.logrm, j = (planDraft.log || []).findIndex(x => logKey(x) === k); if (j >= 0) { planDraft.log.splice(j, 1); planDraft.logRemoved = (planDraft.logRemoved || []).concat([k]).slice(-60); } planChanged(); return show('plan'); }
      });
      // minutes / heart-rate / goal text update the section status as you type (on leaving the field)
      w.addEventListener('change', e => {
        // a "how" line only changes its own section's status: update it in place (a full re-render here would swallow a click on Save)
        if (e.target.matches('[id^=wk-why-],#wk-why,#wk-hr')) { syncPlanFromDom(); const part = e.target.id === 'wk-why' ? 'focus' : e.target.id === 'wk-hr' ? 'cardio' : e.target.id.slice(7), sec = w.querySelector('.wkpart[data-part="' + part + '"]'); if (sec) { const need = partNeeds(part), mins = partMins(part), tgtM = WK_PARTS.find(x => x[0] === part)[2], t = sec.querySelector('.wk-time'); sec.classList.toggle('ok', !need); if (t) { t.classList.toggle('ok', !need); t.textContent = need ? Math.round(mins * 10) / 10 + ' / ' + tgtM + ' min · ' + need : '✓ ' + Math.round(mins * 10) / 10 + ' min'; } } return; }
        if (e.target.matches('.wr-mins,.wr-int,.wkpart[data-part=strength] .wr-sets,.wkpart[data-part=strength] .wr-reps')) { const y = window.scrollY; syncPlanFromDom(); show('plan'); window.scrollTo(0, y); }
      });
      w.querySelectorAll('.wk-pick').forEach(d => d.addEventListener('toggle', () => { wkOpen[d.dataset.part] = d.open; if (d.open) w.querySelectorAll('.wk-pick').forEach(o => { if (o !== d && o.open) { o.open = false; wkOpen[o.dataset.part] = false; } }); }));
      enableWkDrag(w);
      // typing anywhere in the plan: back it up on this device and autosave shortly after
      let typeT = null; w.addEventListener('input', e => { if (e.target.closest('.hwf')) return; clearTimeout(typeT); typeT = setTimeout(() => syncPlanFromDom(), 600); });
    }
  } else if (v === 'myskills') {
    app.innerHTML = myskillsView(state);
    wire('toprofile', () => show(lastHub)); wire('mysave', saveMySkillsUI);
    const cp = $('#mycp'); if (cp) cp.addEventListener('change', () => { entryCp = cp.value; show('myskills'); });
  } else if (v === 'class') {
    app.innerHTML = classView();
    wire('toprofileT', () => { if (state.role === 'student') show('profile'); else renderTeacher(state); });
    wire('todemo', () => startDemo('fresh'));
    wire('tocheckout2', () => openCheckout('class')); wire('toapsum', () => show('apsummary'));
    const cl = $('#mxclass'); if (cl) cl.addEventListener('change', () => { teacherFilter = cl.value; show('class'); });
    document.querySelectorAll('.cpbtn').forEach(b => b.addEventListener('click', () => { teacherCp = b.getAttribute('data-cp'); show('class'); }));
    document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => { const c = th.getAttribute('data-sort'); if (teacherSort.col === c) teacherSort.dir *= -1; else teacherSort = { col: c, dir: 1 }; show('class'); }));
    const tbl = app.querySelector('table.mx');
    if (tbl) {
      tbl.addEventListener('change', e => { const sel = e.target.closest('.cellsel'); if (sel) mxSaveCell(sel); });
      tbl.addEventListener('click', e => { const ab = e.target.closest('[data-assess]'); if (ab) return show('assess', ab.getAttribute('data-assess')); const lb = e.target.closest('[data-lock]'); if (lb) mxToggleLock(lb.getAttribute('data-lock')); });
    }
    wire('mxlockall', () => mxLockAll(true)); wire('mxunlockall', () => mxLockAll(false)); wire('mxcsv', mxExportCsv);
  } else if (v === 'checkout') {
    app.innerHTML = checkoutSetupView();
    wire('coback', coLeave);
    wire('cokiosk', () => { co.step = 'names'; co.sel = null; show('kiosk'); });
    wire('cospot', () => show('spotlight'));
    onWrap(e => {
      const c = e.target.closest('[data-coclass]'); if (c) { coLoadClass(c.getAttribute('data-coclass')); return; }
      const f = e.target.closest('[data-cofocus]'); if (f) { co.focus = f.getAttribute('data-cofocus'); coRemember(); if (co.klass) coLoadClass(co.klass); else show('checkout'); }
    });
  } else if (v === 'kiosk') {
    app.innerHTML = kioskView();
    kioskWire(app);
  } else if (v === 'spotlight') {
    app.innerHTML = spotlightView();
    wire('spback', () => { show('checkout'); coLoadClass(co.klass, true); });
    spotWire(app);
    return;
  } else if (v === 'apsummary') {
    app.innerHTML = apSummaryView();
    wire('apsback', () => show('class')); wire('apscsv', apsCsv);
    const cl = $('#apsclass'); if (cl) cl.addEventListener('change', () => { teacherFilter = cl.value; show('apsummary'); });
    onWrap(e => { const t = e.target.closest('[data-aps]'); if (t) { const p = t.getAttribute('data-aps').split('|'); apsOverlay(p[0], p[1]); } });
  } else if (v === 'skillentry') {
    currentSid = arg || currentSid;
    app.innerHTML = skillEntryView(currentSid);
    wire('toclassback', () => show('class')); wire('sksave', () => saveSkillsUI(currentSid));
    const cp = $('#skcp'); if (cp) cp.addEventListener('change', () => { teacherCp = cp.value; show('skillentry', currentSid); });
  } else if (v === 'assess') {
    currentSid = arg || currentSid;
    app.innerHTML = assessView(currentSid);
    wire('toclassback', () => { assessData = null; show('class'); });
  } else if (v === 'apself') {
    app.innerHTML = apSelfView();
    wire('toprofile', () => show(lastHub)); wire('apsave', saveApSelfUI);
    onWrap(e => { const b = e.target.closest('.apb'); if (!b) return; apDraft[b.dataset.k] = Number(b.dataset.n); const y = window.scrollY; show('apself'); window.scrollTo(0, y); });
  } else {
    app.innerHTML = profileView(state);
    $('#tocard').addEventListener('click', () => show('card'));
    goalSel = null; planDraft = null; unitDraft = null;
    wire('togoals2', () => show('goals')); wire('togoals3', () => show('goals'));
    wire('tomyskills', () => show('myskills')); wire('toteacher', () => demo ? exitDemo() : loadClass()); wire('toarchive', () => show('archive'));
    wire('towo', () => { woStart('profile'); show('workout'); });
    wire('toapself', () => { apDraft = null; show('apself'); }); wire('toapself2', () => { apDraft = null; show('apself'); });
    const apt = $('#aptrend'); if (apt) apt.addEventListener('click', e => { const c = e.target.closest('[data-apkey]'); if (!c) return; e.stopPropagation(); apKey = c.dataset.apkey; apt.innerHTML = apCompare() + apTrend(); });
    wire('hubnext', () => { const g = $('#hubnext').dataset.go, to = { topredict: 'predict', toentry: 'entry', tocompare: 'compare', togoals: 'goals', toplan: 'plan' }[g];
      if (g === 'towo') { woStart('profile'); return show('workout'); } lastHub = 'fitness'; show(to); });
    onWrap(e => { if (openUnit(e)) return; const t = e.target.closest('[data-ov]'); if (t) openOv(t.dataset.ov); });
  }
  if (!(v === 'plan' && prevView === 'plan') && !(v === 'apself' && prevView === 'apself')) window.scrollTo(0, 0);
  badgeCheck();
}

function render(b) {
  state = b; seenBadges = null;
  if (b.role === 'student') { show(b.student.style ? 'profile' : 'card'); return; } // first visit → build your card
  if (b.role === 'teacher') { renderTeacher(b); return; }
  document.body.classList.remove('dark'); $('#app').innerHTML = otherView(b); wire('signout', signOut);
}
function renderTeacher(b) {
  document.body.classList.remove('dark');
  $('#app').innerHTML = teacherLanding(b);
  wire('toclass', loadClass); wire('signout', signOut); wire('tocheckout', () => openCheckout('landing'));
  document.querySelectorAll('.demobox [data-demo]').forEach(x => x.addEventListener('click', () => startDemo(x.getAttribute('data-demo'))));
}
async function loadClass() {
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div>Loading the class…</div>';
  try { classData = await call('classOverview'); show('class'); }
  catch (e) { toast('Couldn’t load the class: ' + e.message, true); if (state.role === 'student') show('profile'); else renderTeacher(state); }
}

$('#ov').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) closeOv(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOv(); });

async function boot() {
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div>Loading your profile…</div>';
  try {
    const b = await call('bootstrap'); render(b);
    let pend = null; try { pend = JSON.parse(sessionStorage.getItem('pe_pending') || 'null'); sessionStorage.removeItem('pe_pending'); } catch (x) {}
    // A kiosk tap interrupted by an expired sign-in is replayed for the teacher, like a student's own save.
    if (pend && /^save/.test(pend.action) && (pend.action === 'saveCheckin' ? (b.role === 'teacher' || b.alsoTeacher) : b.role === 'student')) {
      try { await call(pend.action, pend.payload); render(await call('bootstrap')); toast('Saved what you were doing before you signed in ✓'); }
      catch (x) { toast('Couldn’t save your last change: ' + x.message, true); }
    }
  }
  catch (e) { if (e.authRequired) return; $('#app').innerHTML = message('⚠️', 'Couldn’t load your profile', esc(e.message), '<p><a class="btn" href="javascript:location.reload()">Try again</a></p><p class="small"><button type="button" class="lnk" id="signout">Sign out</button></p>'); wire('signout', signOut); }
}
function main() { token = loadToken(); if (token) boot(); else showSignin(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main); else main();
})();
</script>
